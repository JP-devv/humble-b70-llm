<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8c42"/>
      <stop offset="1" stop-color="#e0562e"/>
    </linearGradient>
    <linearGradient id="cold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4da3ff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="760" height="400" rx="14" fill="#0f172a"/>
  <text x="380" y="38" fill="#f8fafc" font-size="22" font-weight="bold" text-anchor="middle">Qwen3.8-27B-Uncensored INT4 — decode speed on Intel Arc Pro B70</text>
  <text x="380" y="62" fill="#94a3b8" font-size="13" text-anchor="middle">LocalMaxxing-approved (warm, platform protocol) vs strict cold workload protocol</text>

  <!-- axis (0 at y=330, scale 1.46 px per tok/s; max 136.4 -> 199px) -->
  <line x1="90" y1="100" x2="90" y2="330" stroke="#334155" stroke-width="2"/>
  <line x1="90" y1="330" x2="720" y2="330" stroke="#334155" stroke-width="2"/>
  <text x="84" y="96" fill="#94a3b8" font-size="12" text-anchor="end">tok/s</text>

  <!-- 100 tok/s gridline -->
  <line x1="90" y1="184" x2="720" y2="184" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="80" y="188" fill="#64748b" font-size="11" text-anchor="end">100</text>

  <!-- TP2 group -->
  <text x="210" y="352" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle">TP2 — 2x B70</text>
  <rect x="130" y="131" width="130" height="199" rx="6" fill="url(#warm)"/>
  <text x="195" y="158" fill="#fff" font-size="26" font-weight="bold" text-anchor="middle">136.4</text>
  <text x="195" y="178" fill="#ffedd5" font-size="12" text-anchor="middle">lmx approved</text>
  <rect x="285" y="192" width="130" height="138" rx="6" fill="url(#cold)"/>
  <text x="350" y="219" fill="#fff" font-size="26" font-weight="bold" text-anchor="middle">94.6</text>
  <text x="350" y="239" fill="#dbeafe" font-size="12" text-anchor="middle">cold workload</text>

  <!-- TP1 group -->
  <text x="520" y="352" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle">TP1 — 1x B70</text>
  <rect x="440" y="187" width="130" height="143" rx="6" fill="url(#warm)"/>
  <text x="505" y="214" fill="#fff" font-size="26" font-weight="bold" text-anchor="middle">97.8</text>
  <text x="505" y="234" fill="#ffedd5" font-size="12" text-anchor="middle">lmx approved</text>
  <rect x="595" y="232" width="130" height="98" rx="6" fill="url(#cold)"/>
  <text x="660" y="259" fill="#fff" font-size="26" font-weight="bold" text-anchor="middle">66.8</text>
  <text x="660" y="279" fill="#dbeafe" font-size="12" text-anchor="middle">cold workload</text>

  <text x="380" y="390" fill="#64748b" font-size="11" text-anchor="middle">MTP3 speculative decode, FP16 KV, INT8 W8A8 lm_head — higher is better</text>
</svg>
